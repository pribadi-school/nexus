plugins { id 'com.android.application' }

// Dedicated sideload build for the school's Android 10 landscape TVs. Android
// permits Wi-Fi radio control there only for apps targeting API 28 or earlier.
// Keep the normal build's modern target; do not change it for other displays.
def landscapeWifi = providers.gradleProperty('landscapeWifi').orElse('false').get().toBoolean()

android {
    namespace 'sch.id.pribadidepok.nexus.signage'
    compileSdk 36
    defaultConfig {
        applicationId 'sch.id.pribadidepok.nexus.signage'
        minSdk 25
        targetSdk landscapeWifi ? 28 : 36
        versionCode 12
        versionName '1.4.4'
        resValue 'string', 'player_version', versionName
        resValue 'string', 'default_orientation', landscapeWifi ? 'landscape' : 'native'
        resValue 'string', 'build_profile', landscapeWifi ? 'Landscape Wi-Fi (Android 7.1–10)' : 'Standard'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError true
        // This dedicated local-install APK intentionally uses Android 10's
        // documented API-28 compatibility path; it is not a Play Store build.
        if (landscapeWifi) disable 'ExpiredTargetSdkVersion'
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-ui:1.8.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    testImplementation 'junit:junit:4.13.2'
}
