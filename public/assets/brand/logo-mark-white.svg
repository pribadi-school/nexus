<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nexus">
  <!-- White version for dark backgrounds. The hub's stroke matches the navy
       surface (#0F2A5C); change it if you place this on a different colour. -->
  <polygon points="50,14 88,41.6 73.5,86.4 26.5,86.4 12,41.6" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linejoin="round"/>
  <g stroke="#FFFFFF" stroke-width="5" stroke-linecap="round">
    <line x1="50" y1="14" x2="50" y2="54"/>
    <line x1="88" y1="41.6" x2="50" y2="54"/>
    <line x1="73.5" y1="86.4" x2="50" y2="54"/>
    <line x1="26.5" y1="86.4" x2="50" y2="54"/>
    <line x1="12" y1="41.6" x2="50" y2="54"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="50" cy="14" r="6.5"/><circle cx="88" cy="41.6" r="6.5"/>
    <circle cx="73.5" cy="86.4" r="6.5"/><circle cx="26.5" cy="86.4" r="6.5"/>
    <circle cx="12" cy="41.6" r="6.5"/>
  </g>
  <circle cx="50" cy="54" r="12" fill="#B91C1C" stroke="#0F2A5C" stroke-width="4"/>
</svg>
