  <line x1="50" y1="46" x2="50" y2="86" stroke="#1F4E9F" stroke-width="7" stroke-linecap="round"/>
  <circle cx="16" cy="30" r="6" fill="#1F4E9F"/>
  <circle cx="84" cy="30" r="6" fill="#1F4E9F"/>
  <circle cx="32" cy="38" r="6" fill="#1F4E9F"/>
  <circle cx="68" cy="38" r="6" fill="#1F4E9F"/>
  <circle cx="50" cy="46" r="6" fill="#1F4E9F"/>
