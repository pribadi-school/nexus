<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nexus">
  <!-- "Rise": the emblem's raised-arms figure redrawn as connection lines
       that all meet at one point. Full mark, for 56px and up. -->
  <polyline points="16,30 50,86 84,30" fill="none" stroke="#1F4E9F" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="32,38 50,86 68,38" fill="none" stroke="#1F4E9F" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="50" y1="46" x2="50" y2="86" stroke="#1F4E9F" stroke-width="5.5" stroke-linecap="round"/>
  <circle cx="16" cy="30" r="5.5" fill="#1F4E9F"/>
  <circle cx="84" cy="30" r="5.5" fill="#1F4E9F"/>
  <circle cx="32" cy="38" r="5.5" fill="#1F4E9F"/>
  <circle cx="68" cy="38" r="5.5" fill="#1F4E9F"/>
  <circle cx="50" cy="46" r="5.5" fill="#1F4E9F"/>
  <circle cx="50" cy="86" r="6.5" fill="#1F4E9F"/>
  <circle cx="50" cy="19" r="10.5" fill="#B91C1C"/>
</svg>
